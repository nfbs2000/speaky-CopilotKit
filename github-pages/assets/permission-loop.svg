<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1180 560">
  <title id="title">CopilotKit UI를 거치는 Mothership permission loop</title>
  <desc id="desc">Provider runtime이 permission을 요청하고 Mothership이 저장하며 CopilotKit이 렌더링한 뒤 같은 native session으로 응답하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e" />
    </marker>
  </defs>
  <rect width="1180" height="560" rx="18" fill="#ffffff" />
  <rect x="36" y="34" width="1108" height="492" rx="16" fill="#f7f8f4" stroke="#d7ded9" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="74" y="84" font-size="22" font-weight="700" fill="#111827">permission은 반드시 Mothership을 왕복한다</text>
    <text x="74" y="112" font-size="14" fill="#475569">CopilotKit은 approval UI를 렌더링할 수 있지만 native session state는 Mothership에 남는다.</text>

    <g fill="#f8fafc" stroke="#cbd5e1">
      <rect x="76" y="162" width="190" height="72" rx="10" />
      <rect x="356" y="162" width="190" height="72" rx="10" />
      <rect x="636" y="162" width="190" height="72" rx="10" />
      <rect x="916" y="162" width="190" height="72" rx="10" />
    </g>
    <text x="171" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Provider</text>
    <text x="171" y="216" text-anchor="middle" font-size="12" fill="#334155">native tool 호출</text>
    <text x="451" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Mothership</text>
    <text x="451" y="216" text-anchor="middle" font-size="12" fill="#334155">대기 상태</text>
    <text x="731" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">CopilotKit UI</text>
    <text x="731" y="216" text-anchor="middle" font-size="12" fill="#334155">승인 UI 렌더링</text>
    <text x="1011" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">사용자</text>
    <text x="1011" y="216" text-anchor="middle" font-size="12" fill="#334155">결정</text>

    <path d="M266 270 H348" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
    <text x="307" y="256" text-anchor="middle" font-size="12" fill="#0f766e">permission.asked</text>

    <path d="M546 270 H628" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
    <text x="587" y="256" text-anchor="middle" font-size="12" fill="#0f766e">AG-UI event</text>

    <path d="M826 270 H908" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
    <text x="867" y="256" text-anchor="middle" font-size="12" fill="#0f766e">승인 / 거절</text>

    <path d="M916 360 H546" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
    <text x="731" y="346" text-anchor="middle" font-size="12" fill="#0f766e">respondPermission(runId, requestId, decision)</text>

    <path d="M356 430 H266" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
    <text x="311" y="416" text-anchor="middle" font-size="12" fill="#0f766e">같은 native session</text>

    <rect x="76" y="462" width="1030" height="38" rx="8" fill="#fff7ed" stroke="#f0bf7a" />
    <text x="100" y="486" font-size="13" font-weight="700" fill="#8a3f0b">잘못된 경로:</text>
    <text x="198" y="486" font-size="13" fill="#334155">Mothership 호출 없이 browser local state만 바꾸고 native permission 성공처럼 처리하는 흐름.</text>
  </g>
</svg>
