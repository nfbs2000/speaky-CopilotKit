<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1180 660">
  <title id="title">CopilotKit standard interrupt와 OpenCode native permission reply 왕복</title>
  <desc id="desc">Mothership이 permission을 저장하고 AG-UI projector가 standard interrupt를 보내며 사용자의 resume를 같은 OpenCode request ID의 permission.reply로 전달하는 흐름이다.</desc>
  <defs>
    <marker id="arrow-forward" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e" />
    </marker>
    <marker id="arrow-return" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="1180" height="660" rx="18" fill="#ffffff" />
  <rect x="34" y="32" width="1112" height="596" rx="16" fill="#f7f8f4" stroke="#d7ded9" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="70" y="80" font-size="22" font-weight="800" fill="#111827">Native permission은 standard interrupt로 보이고 permission.reply로 돌아간다</text>
    <text x="70" y="108" font-size="14" fill="#475569">첫 AG-UI SSE는 interrupt에서 끝난다. resume 요청은 새 native turn을 만들지 않고 같은 pending request를 재개한다.</text>

    <g fill="#f8fafc" stroke="#cbd5e1">
      <rect x="58" y="150" width="180" height="76" rx="8" />
      <rect x="278" y="150" width="180" height="76" rx="8" />
      <rect x="498" y="150" width="180" height="76" rx="8" />
      <rect x="718" y="150" width="180" height="76" rx="8" />
      <rect x="938" y="150" width="180" height="76" rx="8" />
    </g>

    <text x="148" y="182" text-anchor="middle" font-size="16" font-weight="800" fill="#064e3b">OpenCode</text>
    <text x="148" y="205" text-anchor="middle" font-size="12" fill="#334155">native session / turn</text>
    <text x="368" y="182" text-anchor="middle" font-size="16" font-weight="800" fill="#064e3b">Mothership</text>
    <text x="368" y="205" text-anchor="middle" font-size="12" fill="#334155">ledger / pending request</text>
    <text x="588" y="182" text-anchor="middle" font-size="16" font-weight="800" fill="#064e3b">AG-UI Adapter</text>
    <text x="588" y="205" text-anchor="middle" font-size="12" fill="#334155">projector / resume dispatch</text>
    <text x="808" y="182" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">CopilotKit</text>
    <text x="808" y="205" text-anchor="middle" font-size="12" fill="#334155">useInterrupt</text>
    <text x="1028" y="182" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">사용자</text>
    <text x="1028" y="205" text-anchor="middle" font-size="12" fill="#334155">once / always / reject</text>

    <path d="M238 270 H270" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-forward)" />
    <text x="254" y="254" text-anchor="middle" font-size="11" fill="#0f766e">permission.asked</text>

    <path d="M458 270 H490" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-forward)" />
    <text x="474" y="254" text-anchor="middle" font-size="11" fill="#0f766e">committed envelope</text>

    <path d="M678 270 H710" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-forward)" />
    <text x="694" y="244" text-anchor="middle" font-size="11" fill="#0f766e">RUN_FINISHED</text>
    <text x="694" y="259" text-anchor="middle" font-size="11" fill="#0f766e">outcome: interrupt</text>

    <path d="M898 270 H930" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-forward)" />
    <text x="914" y="254" text-anchor="middle" font-size="11" fill="#0f766e">버튼 표시</text>

    <path d="M1028 302 V350 H808" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-return)" />
    <text x="918" y="337" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">resolve({ decision })</text>

    <path d="M808 390 H596" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-return)" />
    <text x="702" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">RunAgentInput.resume[]</text>

    <path d="M580 414 V466 H376" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-return)" />
    <text x="478" y="451" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">respondPermission(runId, turnId, requestId)</text>

    <path d="M358 506 H156" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-return)" />
    <text x="257" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">permission.reply(requestID, once | always | reject)</text>

    <rect x="58" y="550" width="1060" height="50" rx="8" fill="#fff7ed" stroke="#f0bf7a" />
    <text x="82" y="571" font-size="13" font-weight="800" fill="#8a3f0b">불변식</text>
    <text x="142" y="571" font-size="13" fill="#334155">CopilotKit resume는 새 prompt나 새 OpenCode session이 아니다.</text>
    <text x="142" y="590" font-size="13" fill="#334155">Mothership의 같은 run, 같은 turn, 같은 native request ID를 재개한다. followUp은 이 경로에 사용하지 않는다.</text>
  </g>
</svg>
