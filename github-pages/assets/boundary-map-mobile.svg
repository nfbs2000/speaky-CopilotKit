<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 390 690">
  <title id="title">모바일용 Mothership AG-UI projection adapter 경계</title>
  <desc id="desc">CopilotKit, projection adapter, Mothership과 OpenCode의 단일 소유권 경계를 세로로 보여준다.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#0f766e" />
    </marker>
  </defs>
  <rect width="390" height="690" rx="18" fill="#f6f7f3" />
  <rect x="18" y="18" width="354" height="654" rx="14" fill="#ffffff" stroke="#d7ded9" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="36" y="52" font-size="17" font-weight="800" fill="#111827">기본안: projection adapter</text>
    <text x="36" y="76" font-size="11" fill="#475569">Runtime보다 adapter 계약을 먼저 검증한다.</text>

    <rect x="48" y="108" width="294" height="62" rx="8" fill="#eef4ff" stroke="#b8cdf8" />
    <text x="195" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">CopilotKit UI</text>
    <text x="195" y="154" text-anchor="middle" font-size="11" fill="#334155">chat / useInterrupt</text>

    <path d="M178 176 V208" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="199" y="196" font-size="10" fill="#2563eb">RunAgentInput / resume[]</text>

    <rect x="48" y="216" width="294" height="62" rx="8" fill="#eef4ff" stroke="#b8cdf8" />
    <text x="195" y="242" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Mothership AG-UI Adapter</text>
    <text x="195" y="262" text-anchor="middle" font-size="11" fill="#334155">projector / native resume dispatch</text>

    <path d="M178 284 V316" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="199" y="304" font-size="10" fill="#0f766e">command / committed envelope</text>

    <rect x="48" y="324" width="294" height="62" rx="8" fill="#ecfdf5" stroke="#99d7c5" />
    <text x="195" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Mothership runtime</text>
    <text x="195" y="370" text-anchor="middle" font-size="11" fill="#334155">run / turn / ledger / permission</text>

    <path d="M178 392 V424" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="199" y="412" font-size="10" fill="#0f766e">prompt / permission.reply / SSE</text>

    <rect x="48" y="432" width="294" height="62" rx="8" fill="#ecfdf5" stroke="#99d7c5" />
    <text x="195" y="458" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">OpenCode native session</text>
    <text x="195" y="478" text-anchor="middle" font-size="11" fill="#334155">single execution owner</text>

    <rect x="48" y="534" width="294" height="72" rx="8" fill="#fff7ed" stroke="#f0bf7a" />
    <text x="195" y="558" text-anchor="middle" font-size="14" font-weight="800" fill="#8a3f0b">저장 후 projection</text>
    <text x="195" y="579" text-anchor="middle" font-size="11" fill="#334155">raw -> event -> envelope / seq</text>
    <text x="195" y="596" text-anchor="middle" font-size="11" fill="#334155">replay + live + gap detection</text>

    <rect x="48" y="628" width="294" height="28" rx="7" fill="#f8fafc" stroke="#d7ded9" />
    <text x="195" y="647" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">adapter = projector + native resume dispatch</text>
  </g>
</svg>
